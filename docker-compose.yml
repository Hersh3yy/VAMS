services:
    api:
        build:
            context: .
            target: app
        image: vams-app
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8080}:80"
        env_file:
            - .env
        environment:
            RUN_MIGRATIONS: "${RUN_MIGRATIONS:-false}"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started

    # Service name matches .env DB_HOST=postgres. Mirrors the Coolify-managed
    # Postgres resource this app talks to in production.
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: "${DB_DATABASE:-vams}"
            POSTGRES_USER: "${DB_USERNAME:-vams}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
        ports:
            - "${FORWARD_DB_PORT:-5432}:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vams} -d ${DB_DATABASE:-vams}"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        volumes:
            - redis-data:/data

volumes:
    db-data:
    redis-data:
