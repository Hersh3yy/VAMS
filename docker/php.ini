; Application PHP overrides (loaded after base config)

; Uploads — generous limits; the new server has no upstream payload cap.
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 50

; Resources — image processing (GD/Imagick) can be memory hungry.
memory_limit = 512M
max_execution_time = 120

; Misc
expose_php = Off
date.timezone = UTC

; OPcache — production performance.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
